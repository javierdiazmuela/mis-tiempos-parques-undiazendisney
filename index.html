<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiempos & Zonas en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 antialiased">

  <!-- Banner de reaperturas instantáneas (Caza-colas) -->
  <div id="reopeningBanner" class="hidden bg-emerald-600 text-white px-4 py-2 text-xs font-semibold flex items-center justify-between sticky top-0 z-40 shadow-lg animate-pulse">
    <div class="flex items-center gap-2">
      <span class="text-base">🚨</span>
      <span id="reopeningText">¡Atracción reabierta!</span>
    </div>
    <button onclick="document.getElementById('reopeningBanner').classList.add('hidden')" class="text-white/80 hover:text-white text-base font-bold ml-2">×</button>
  </div>

  <!-- Cabecera fija -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">🎢</span>
        <div>
          <h1 class="text-base font-bold leading-tight tracking-tight">WaitTimes Live</h1>
          <p id="lastUpdateTxt" class="text-[10px] text-slate-400">Iniciando...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <!-- Selector de Vista (Lista vs Zonas) -->
        <button id="viewToggleBtn" onclick="toggleViewMode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-xl border border-slate-700 transition flex items-center gap-1">
          <span id="viewIcon">🗺️</span>
          <span id="viewLabel">Zonas</span>
        </button>
        <button id="refreshBtn" onclick="cargarTodo()" class="flex items-center gap-1 text-xs bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium px-3 py-1.5 rounded-xl transition shadow">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-3 space-y-3">

    <!-- Selector de Parque -->
    <div>
      <select id="parkSelect" onchange="cargarTodo()" class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm font-medium text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner">
        <option value="5adbd2f7-3694-4d23-aaec-4037a056573f">Parque Warner Madrid</option>
        <option value="1ea86991-e2c2-4771-8a32-c6e14c8298a9">Parque de Atracciones de Madrid</option>
        <option value="dae968d5-630d-4719-8b06-3d107e944401">Disneyland Park (París)</option>
        <option value="ca888437-ebb4-4d50-aed2-d227f7096968">Disney Adventure World (París)</option>
      </select>
    </div>

    <!-- Panel de Estado, Horario y Contador del Día -->
    <div class="bg-gradient-to-br from-slate-900 to-slate-850 border border-slate-800 rounded-2xl p-3 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 font-medium text-slate-300">
          <span>🕒</span>
          <span id="scheduleText">Cargando horario...</span>
        </div>
        <label class="flex items-center gap-1.5 text-[11px] text-slate-400 cursor-pointer">
          <input type="checkbox" id="autoRefreshCheck" onchange="toggleAutoRefresh()" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
          Auto 60s
        </label>
      </div>

      <!-- Métricas -->
      <div class="grid grid-cols-4 gap-1.5 pt-1 border-t border-slate-800/80 text-center text-[10px]">
        <div class="bg-emerald-950/30 border border-emerald-900/40 rounded-xl py-1 px-1">
          <span class="text-emerald-400 font-bold text-sm block" id="countOpen">0</span>
          <span class="text-slate-400">Abiertas</span>
        </div>
        <div class="bg-amber-950/30 border border-amber-900/40 rounded-xl py-1 px-1">
          <span class="text-amber-400 font-bold text-sm block" id="countDown">0</span>
          <span class="text-slate-400">En pausa</span>
        </div>
        <div class="bg-slate-800/40 border border-slate-800 rounded-xl py-1 px-1">
          <span class="text-slate-400 font-bold text-sm block" id="countClosed">0</span>
          <span class="text-slate-500">Cerradas</span>
        </div>
        <div class="bg-indigo-950/30 border border-indigo-900/40 rounded-xl py-1 px-1">
          <span class="text-indigo-400 font-bold text-sm block" id="countRidden">0</span>
          <span class="text-slate-400">Montadas</span>
        </div>
      </div>
    </div>

    <!-- Filtros de Categoría -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
      <button onclick="setFilter('all')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-indigo-600 text-white" data-filter="all">Todos</button>
      <button onclick="setFilter('favs')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800" data-filter="favs">⭐ Favoritos</button>
      <button onclick="setFilter('attractions')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800" data-filter="attractions">🎢 Atracciones</button>
      <button onclick="setFilter('shows')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800" data-filter="shows">🎭 Shows</button>
      <button onclick="setFilter('dining')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800" data-filter="dining">🍴 Comida</button>
      <button onclick="setFilter('open')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800" data-filter="open">🟢 Abiertas</button>
      <button onclick="setFilter('single')" class="filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800" data-filter="single">⚡ Single</button>
    </div>

    <!-- Buscador y Ordenación -->
    <div class="flex gap-2">
      <div class="relative flex-1">
        <input type="text" id="searchInput" oninput="renderLista()" placeholder="Buscar por nombre o zona..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs placeholder-slate-500 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <select id="sortSelect" onchange="renderLista()" class="bg-slate-900 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="waitDesc">Más espera</option>
        <option value="waitAsc">Menos espera</option>
        <option value="alpha">A - Z</option>
      </select>
    </div>

    <!-- Indicador de Carga -->
    <div id="loadingStatus" class="text-center py-8 text-xs text-slate-400">
      <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-500 border-t-transparent mb-2"></div>
      <div>Obteniendo mapa y datos en vivo...</div>
    </div>

    <!-- Contenedor Principal de Tarjetas -->
    <div id="cardsContainer" class="space-y-3"></div>

    <!-- Pie de página con atribución obligatoria -->
    <footer class="pt-6 pb-2 text-center text-xs text-slate-500 space-y-1">
      <p>
        <a href="https://themeparks.wiki" target="_blank" class="underline hover:text-slate-400">
          Powered by ThemeParks.wiki
        </a>
      </p>
    </footer>
  </main>

  <script>
    let entidades = [];
    let landMap = {}; // entityId -> Nombre de la Zona
    let filtroActivo = 'all';
    let viewMode = 'list'; // 'list' o 'zones'
    let autoRefreshTimer = null;

    // Almacenamiento previo para detección de tendencias y reaperturas
    let prevStatus = {};
    let prevWaitTimes = {};

    // Favoritos
    function getFavoritos() {
      try { return JSON.parse(localStorage.getItem('tp_favs_v1') || '[]'); } catch { return []; }
    }
    function toggleFavorito(id, event) {
      if (event) event.stopPropagation();
      let favs = getFavoritos();
      favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
      localStorage.setItem('tp_favs_v1', JSON.stringify(favs));
      renderLista();
    }

    // Checklist del día: "Ya me he montado"
    function getRiddenToday() {
      const hoy = new Date().toISOString().split('T')[0];
      try { return JSON.parse(localStorage.getItem(`tp_ridden_${hoy}`) || '[]'); } catch { return []; }
    }
    function toggleRidden(id, event) {
      if (event) event.stopPropagation();
      const hoy = new Date().toISOString().split('T')[0];
      let ridden = getRiddenToday();
      ridden = ridden.includes(id) ? ridden.filter(r => r !== id) : [...ridden, id];
      localStorage.setItem(`tp_ridden_${hoy}`, JSON.stringify(ridden));
      actualizarContadorRidden();
      renderLista();
    }
    function actualizarContadorRidden() {
      document.getElementById('countRidden').textContent = getRiddenToday().length;
    }

    // Alternar vista lista / agrupado por zonas
    function toggleViewMode() {
      viewMode = viewMode === 'list' ? 'zones' : 'list';
      document.getElementById('viewIcon').textContent = viewMode === 'zones' ? '📋' : '🗺️';
      document.getElementById('viewLabel').textContent = viewMode === 'zones' ? 'Lista' : 'Zonas';
      renderLista();
    }

    // Carga de todos los endpoints en paralelo
    async function cargarTodo() {
      const parkId = document.getElementById('parkSelect').value;
      const loader = document.getElementById('loadingStatus');
      const container = document.getElementById('cardsContainer');

      loader.classList.remove('hidden');
      container.innerHTML = '';
      document.getElementById('lastUpdateTxt').textContent = 'Sincronizando...';

      try {
        await Promise.allSettled([
          cargarZonas(parkId),
          cargarHorarios(parkId),
          cargarLive(parkId)
        ]);
        const ahora = new Date();
        document.getElementById('lastUpdateTxt').textContent = `Actualizado ${ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        actualizarContadorRidden();
      } catch (err) {
        console.error('Error general:', err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    // 1. Obtener árbol de Zonas (/children)
    async function cargarZonas(parkId) {
      try {
        const res = await fetch(`https://api.themeparks.wiki/v1/entity/${parkId}/children`);
        if (!res.ok) return;
        const data = await res.json();
        landMap = parseLands(data);
      } catch (e) {
        console.warn('No se pudieron obtener las zonas:', e);
        landMap = {};
      }
    }

    function parseLands(data) {
      const mapping = {};
      const landsById = {};
      const items = Array.isArray(data) ? data : (data.children || []);

      // Paso 1: localizar entidades de tipo LAND
      function buscarLands(nodes) {
        if (!nodes) return;
        nodes.forEach(n => {
          if (n.entityType === 'LAND') landsById[n.id] = n.name;
          if (n.children) buscarLands(n.children);
        });
      }
      buscarLands(items);

      // Paso 2: asociar atracción con su zona
      function asignar(nodes, currentLand) {
        if (!nodes) return;
        nodes.forEach(n => {
          let activeLand = currentLand;
          if (n.entityType === 'LAND') {
            activeLand = n.name;
          } else if (n.parentId && landsById[n.parentId]) {
            activeLand = landsById[n.parentId];
          }
          if (n.id && activeLand && n.entityType !== 'LAND') {
            mapping[n.id] = activeLand;
          }
          if (n.children) asignar(n.children, activeLand);
        });
      }
      asignar(items, null);
      return mapping;
    }

    // 2. Horarios del día (/schedule)
    async function cargarHorarios(parkId) {
      const scheduleTxt = document.getElementById('scheduleText');
      try {
        const res = await fetch(`https://api.themeparks.wiki/v1/entity/${parkId}/schedule`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const lista = Array.isArray(data) ? data : (data.schedule || []);
        const hoyStr = new Date().toISOString().split('T')[0];
        const hoySchedule = lista.find(item => item.date === hoyStr && item.type === 'OPERATING') || lista[0];

        if (hoySchedule && hoySchedule.openingTime && hoySchedule.closingTime) {
          const open = new Date(hoySchedule.openingTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const close = new Date(hoySchedule.closingTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          scheduleTxt.textContent = `Hoy: ${open} – ${close}`;
        } else {
          scheduleTxt.textContent = 'Horario de hoy no publicado';
        }
      } catch {
        scheduleTxt.textContent = 'Horario no disponible';
      }
    }

    // 3. Tiempos en vivo (/live) + Detección de reaperturas y tendencias
    async function cargarLive(parkId) {
      const res = await fetch(`https://api.themeparks.wiki/v1/entity/${parkId}/live`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      entidades = data.liveData || [];

      let abiertas = 0, pausa = 0, cerradas = 0;
      let reabiertas = [];
      const newStatus = {};
      const newWaits = {};

      entidades.forEach(item => {
        const estado = item.status || 'CLOSED';
        const tiempo = item.queue?.STANDBY?.waitTime;

        if (estado === 'OPERATING') abiertas++;
        else if (estado === 'DOWN') pausa++;
        else cerradas++;

        // Detectar si pasa de averiada a abierta
        if (prevStatus[item.id] === 'DOWN' && estado === 'OPERATING') {
          reabiertas.push(item.name);
        }

        newStatus[item.id] = estado;
        if (tiempo !== undefined && tiempo !== null) {
          newWaits[item.id] = tiempo;
        }
      });

      // Mostrar banner si hay reaperturas
      if (reabiertas.length > 0) {
        const banner = document.getElementById('reopeningBanner');
        document.getElementById('reopeningText').textContent = `¡Acaba de reabrir: ${reabiertas.join(', ')}!`;
        banner.classList.remove('hidden');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }

      document.getElementById('countOpen').textContent = abiertas;
      document.getElementById('countDown').textContent = pausa;
      document.getElementById('countClosed').textContent = cerradas;

      // Actualizar referencias históricas para la siguiente lectura
      prevStatus = newStatus;
      prevWaitTimes = newWaits;

      renderLista();
    }

    function setFilter(filtro) {
      filtroActivo = filtro;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        if (btn.dataset.filter === filtro) {
          btn.className = 'filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-indigo-600 text-white';
        } else {
          btn.className = 'filter-chip px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition bg-slate-900 text-slate-300 border border-slate-800';
        }
      });
      renderLista();
    }

    // Renderizado general
    function renderLista() {
      const container = document.getElementById('cardsContainer');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const sortType = document.getElementById('sortSelect').value;
      const favs = getFavoritos();
      const ridden = getRiddenToday();

      container.innerHTML = '';

      let filtradas = entidades.filter(item => {
        const landName = landMap[item.id] || '';
        const matchesQuery = item.name.toLowerCase().includes(query) || landName.toLowerCase().includes(query);
        if (!matchesQuery) return false;

        const isFav = favs.includes(item.id);
        const isShow = item.entityType === 'SHOW' || (item.showtimes && item.showtimes.length > 0);
        const isDining = item.entityType === 'RESTAURANT';
        const isOpen = item.status === 'OPERATING';
        const hasSingle = item.queue?.SINGLE_RIDER?.waitTime != null;

        if (filtroActivo === 'favs') return isFav;
        if (filtroActivo === 'shows') return isShow;
        if (filtroActivo === 'dining') return isDining;
        if (filtroActivo === 'attractions') return !isShow && !isDining;
        if (filtroActivo === 'open') return isOpen;
        if (filtroActivo === 'single') return hasSingle;
        return true;
      });

      // Ordenación
      filtradas.sort((a, b) => {
        if (filtroActivo === 'all') {
          const favA = favs.includes(a.id) ? 1 : 0;
          const favB = favs.includes(b.id) ? 1 : 0;
          if (favA !== favB) return favB - favA;
        }
        const waitA = a.queue?.STANDBY?.waitTime ?? -1;
        const waitB = b.queue?.STANDBY?.waitTime ?? -1;

        if (sortType === 'waitDesc') return waitB - waitA;
        if (sortType === 'waitAsc') return (waitA === -1 ? 999 : waitA) - (waitB === -1 ? 999 : waitB);
        if (sortType === 'alpha') return a.name.localeCompare(b.name);
        return 0;
      });

      if (filtradas.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-xs text-slate-500">No se encontraron elementos con este filtro.</div>';
        return;
      }

      // VISTA POR ZONAS / LANDS
      if (viewMode === 'zones') {
        const grupos = {};
        filtradas.forEach(item => {
          const zona = landMap[item.id] || 'Otras áreas / General';
          if (!grupos[zona]) grupos[zona] = [];
          grupos[zona].push(item);
        });

        Object.keys(grupos).sort().forEach(zona => {
          const section = document.createElement('div');
          section.className = 'space-y-2';

          const header = document.createElement('div');
          header.className = 'flex items-center justify-between pt-2 pb-1 text-xs font-semibold text-indigo-300 border-b border-slate-800';
          header.innerHTML = `
            <span class="flex items-center gap-1.5">📍 ${zona}</span>
            <span class="text-[10px] text-slate-500 font-normal">${grupos[zona].length} elementos</span>
          `;
          section.appendChild(header);

          grupos[zona].forEach(item => {
            section.appendChild(crearCardElemento(item, favs, ridden));
          });

          container.appendChild(section);
        });
      } else {
        // VISTA LISTA PLANA
        filtradas.forEach(item => {
          container.appendChild(crearCardElemento(item, favs, ridden));
        });
      }
    }

    // Creación de cada tarjeta
    function crearCardElemento(item, favs, ridden) {
      const isFav = favs.includes(item.id);
      const isRidden = ridden.includes(item.id);
      const isShow = item.entityType === 'SHOW' || (item.showtimes && item.showtimes.length > 0);
      const isDining = item.entityType === 'RESTAURANT';
      const status = item.status || 'CLOSED';
      const wait = item.queue?.STANDBY?.waitTime;
      const singleWait = item.queue?.SINGLE_RIDER?.waitTime;
      const paidReturn = item.queue?.PAID_RETURN_TIME;
      const boarding = item.queue?.BOARDING_GROUP;
      const landName = landMap[item.id];

      // Tendencia de espera (↑ o ↓)
      let trendHtml = '';
      if (prevWaitTimes[item.id] !== undefined && wait !== undefined && wait !== null) {
        const diff = wait - prevWaitTimes[item.id];
        if (diff > 0) trendHtml = `<span class="text-[10px] text-rose-400 font-bold block">↑ +${diff}m</span>`;
        else if (diff < 0) trendHtml = `<span class="text-[10px] text-emerald-400 font-bold block">↓ ${diff}m</span>`;
      }

      // Badge de estado
      let badgeHtml = '';
      if (status === 'OPERATING') {
        if (wait !== undefined && wait !== null) {
          const colorClass = wait > 45 ? 'bg-rose-500/15 text-rose-300 border-rose-500/30' :
                             wait > 20 ? 'bg-amber-500/15 text-amber-300 border-amber-500/30' :
                             'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
          badgeHtml = `
            <div class="text-right">
              <span class="text-base font-bold px-2.5 py-1 rounded-xl border ${colorClass} inline-block">${wait} min</span>
              ${trendHtml}
            </div>`;
        } else {
          badgeHtml = `<span class="text-xs px-2.5 py-1 rounded-xl bg-emerald-950/60 text-emerald-300 border border-emerald-800/40">Abierto</span>`;
        }
      } else if (status === 'DOWN') {
        badgeHtml = `<span class="text-xs px-2 py-0.5 rounded-lg bg-amber-950/60 text-amber-300 border border-amber-800/50">En pausa</span>`;
      } else if (status === 'REFURBISHMENT') {
        badgeHtml = `<span class="text-xs px-2 py-0.5 rounded-lg bg-blue-950/60 text-blue-300 border border-blue-800/50">Mantenimiento</span>`;
      } else {
        badgeHtml = `<span class="text-xs px-2 py-0.5 rounded-lg bg-slate-900 text-slate-500 border border-slate-800">Cerrado</span>`;
      }

      // Filas adicionales: Single Rider, Disney Premier Access, Grupos
      const pills = [];
      if (singleWait != null) {
        pills.push(`<span class="inline-flex items-center text-[10px] bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 px-2 py-0.5 rounded-md">⚡ Single: <b>${singleWait}m</b></span>`);
      }
      if (paidReturn && paidReturn.returnStart) {
        const horaIni = formatHora(paidReturn.returnStart);
        const horaFin = paidReturn.returnEnd ? formatHora(paidReturn.returnEnd) : '';
        const precio = paidReturn.price?.formatted ? ` • ${paidReturn.price.formatted}` : '';
        pills.push(`<span class="inline-flex items-center text-[10px] bg-purple-950/60 text-purple-300 border border-purple-800/40 px-2 py-0.5 rounded-md">🎟️ Pase: ${horaIni}-${horaFin}${precio}</span>`);
      }
      if (boarding && boarding.currentGroupStart) {
        pills.push(`<span class="inline-flex items-center text-[10px] bg-cyan-950/60 text-cyan-300 border border-cyan-800/40 px-2 py-0.5 rounded-md">👥 Grupos: ${boarding.currentGroupStart}–${boarding.currentGroupEnd || ''}</span>`);
      }
      if (item.showtimes && item.showtimes.length > 0) {
        const proximos = item.showtimes.slice(0, 3).map(st => formatHora(st.startTime)).join(', ');
        pills.push(`<span class="text-[10px] text-amber-300/90 bg-amber-950/40 border border-amber-900/40 px-2 py-0.5 rounded-md">🎭 Pases: ${proximos}</span>`);
      }

      const extraInfoHtml = pills.length > 0 ? `<div class="flex flex-wrap gap-1 mt-2 pt-2 border-t border-slate-800/60">${pills.join('')}</div>` : '';

      const card = document.createElement('div');
      card.className = `bg-slate-900/80 border ${isFav ? 'border-amber-500/40 bg-amber-950/10' : 'border-slate-800/70'} p-3 rounded-2xl shadow-sm transition ${isRidden ? 'opacity-50' : ''}`;
      
      const tipoEtiqueta = isShow ? 'Espectáculo' : isDining ? 'Restaurante' : 'Atracción';

      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-start gap-2.5 min-w-0">
            <!-- Botón Favorito -->
            <button onclick="toggleFavorito('${item.id}', event)" class="text-base mt-0.5 active:scale-125 focus:outline-none" title="Favorito">
              ${isFav ? '⭐' : '☆'}
            </button>
            <div class="min-w-0">
              <h3 class="font-medium text-sm text-slate-100 leading-snug line-clamp-2 ${isRidden ? 'line-through text-slate-400' : ''}">${item.name}</h3>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="text-[10px] text-slate-500 uppercase tracking-wider">${tipoEtiqueta}</span>
                ${landName ? `<span class="text-[10px] text-indigo-400/80 truncate">• ${landName}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            ${badgeHtml}
            <!-- Botón Check Hecho -->
            ${!isShow && !isDining ? `
              <button onclick="toggleRidden('${item.id}', event)" class="text-xs p-1 rounded-lg border ${isRidden ? 'bg-emerald-600/20 border-emerald-500/40 text-emerald-400' : 'border-slate-800 text-slate-600 hover:text-slate-400'}" title="Marcar como montada">
                ✓
              </button>
            ` : ''}
          </div>
        </div>
        ${extraInfoHtml}
      `;
      return card;
    }

    function formatHora(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        return isNaN(d.getTime()) ? isoStr : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch {
        return isoStr;
      }
    }

    // Auto-refresco
    function toggleAutoRefresh() {
      const isChecked = document.getElementById('autoRefreshCheck').checked;
      if (isChecked) {
        autoRefreshTimer = setInterval(() => {
          cargarLive(document.getElementById('parkSelect').value);
        }, 60000);
      } else {
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      }
    }

    // Arranque inicial
    cargarTodo();
  </script>
</body>
</html>
