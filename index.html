<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiempos, Zonas & Mapa en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Estilos y scripts de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Popups claros para el mapa */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 1rem !important;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15) !important;
      padding: 0.25rem !important;
    }
    .leaflet-popup-tip {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
    }
    .leaflet-popup-close-button {
      color: #64748b !important;
      padding: 6px !important;
    }
  </style>
</head>
<body id="pageBody" class="bg-slate-100 text-slate-800 min-h-screen pb-16 antialiased transition-colors duration-300">

  <!-- Banner de reaperturas instantáneas ("Caza-Colas") -->
  <div id="reopeningBanner" class="hidden text-white px-4 py-2.5 text-xs font-semibold flex items-center justify-between sticky top-0 z-50 shadow-xl animate-pulse">
    <div class="flex items-center gap-2">
      <span class="text-base">🚨</span>
      <span id="reopeningText">¡Atracción acaba de reabrir!</span>
    </div>
    <button onclick="document.getElementById('reopeningBanner').classList.add('hidden')" class="text-white/90 hover:text-white text-base font-bold ml-2">✕</button>
  </div>

  <!-- Cabecera fija con franja temática inferior -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 pt-3 pb-2.5 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span id="headerIcon" class="text-xl transition-transform duration-300">🪄</span>
        <div>
          <h1 id="headerTitle" class="text-sm font-extrabold tracking-tight transition-colors duration-300">WaitTimes</h1>
          <p id="lastUpdateTxt" class="text-[10px] text-slate-500 font-medium">Iniciando...</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <!-- Selector de Vista: Lista / Zonas / Mapa -->
        <div class="flex bg-slate-100 p-0.5 rounded-xl border border-slate-300 text-xs">
          <button id="btnViewList" onclick="setViewMode('list')" class="px-2 py-1 rounded-lg font-medium transition text-slate-600" title="Vista Lista">📋</button>
          <button id="btnViewZones" onclick="setViewMode('zones')" class="px-2 py-1 rounded-lg font-bold transition shadow-sm" title="Vista Zonas">🗺️</button>
          <button id="btnViewMap" onclick="setViewMode('map')" class="px-2 py-1 rounded-lg font-medium transition text-slate-600" title="Vista Mapa">📍</button>
        </div>
        <!-- Botón refrescar temático -->
        <button id="refreshBtn" onclick="cargarTodo()" class="text-xs active:scale-95 font-medium p-2 rounded-xl transition shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>
    <!-- Franja inferior de color temática -->
    <div id="headerAccentBar" class="h-1 w-full max-w-md mx-auto mt-2.5 rounded-full transition-all duration-500"></div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-3 space-y-3">

    <!-- Selector de Parque -->
    <div>
      <select id="parkSelect" onchange="cambiarDeParque()" class="w-full bg-white border border-slate-300 rounded-2xl px-3.5 py-2.5 text-xs font-bold text-slate-900 focus:outline-none shadow-sm">
        <option value="dae968d5-630d-4719-8b06-3d107e944401">Disneyland Park (París)</option>
        <option value="ca888437-ebb4-4d50-aed2-d227f7096968">Disney Adventure World (París)</option>
        <option value="5adbd2f7-3694-4d23-aaec-4037a056573f">Parque Warner Madrid</option>
        <option value="1ea86991-e2c2-4771-8a32-c6e14c8298a9">Parque de Atracciones de Madrid</option>
      </select>
    </div>

    <!-- Panel de Horario y Resumen de Estado -->
    <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-1.5 font-bold" id="scheduleTextWrapper">
          <span>🕒</span>
          <span id="scheduleText">Cargando horario oficial...</span>
        </div>
        <label class="flex items-center gap-1 text-[11px] font-medium text-slate-500 cursor-pointer">
          <input type="checkbox" id="autoRefreshCheck" onchange="toggleAutoRefresh()" class="rounded border-slate-300 focus:ring-0">
          Auto 60s
        </label>
      </div>

      <!-- Métricas del parque -->
      <div class="grid grid-cols-4 gap-1.5 pt-1 border-t border-slate-100 text-center text-[10px]">
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl py-1 px-1">
          <span class="text-emerald-700 font-extrabold text-sm block" id="countOpen">0</span>
          <span class="text-emerald-900 font-medium">Abiertas</span>
        </div>
        <div class="bg-amber-50 border border-amber-200 rounded-xl py-1 px-1">
          <span class="text-amber-700 font-extrabold text-sm block" id="countDown">0</span>
          <span class="text-amber-900 font-medium">En pausa</span>
        </div>
        <div class="bg-slate-100 border border-slate-200 rounded-xl py-1 px-1">
          <span class="text-slate-600 font-extrabold text-sm block" id="countClosed">0</span>
          <span class="text-slate-500 font-medium">Cerradas</span>
        </div>
        <div class="bg-slate-100 border border-slate-200 rounded-xl py-1 px-1">
          <span class="text-slate-800 font-extrabold text-sm block" id="countRidden">0</span>
          <span class="text-slate-600 font-medium">Montadas</span>
        </div>
      </div>
    </div>

    <!-- Fila 1: Filtro de Categorías -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
      <button onclick="setCatFilter('all')" class="cat-chip px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition shadow-sm border" data-cat="all">Todos</button>
      <button onclick="setCatFilter('favs')" class="cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border" data-cat="favs">⭐ Favoritos</button>
      <button onclick="setCatFilter('attractions')" class="cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border" data-cat="attractions">🎢 Atracciones</button>
      <button onclick="setCatFilter('shows')" class="cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border" data-cat="shows">🎭 Shows</button>
      <button onclick="setCatFilter('characters')" class="cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border" data-cat="characters">📸 Personajes</button>
      <button onclick="setCatFilter('dining')" class="cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border" data-cat="dining">🍔 Restaurantes</button>
      <button onclick="setCatFilter('shops')" class="cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border" data-cat="shops">🛍️ Tiendas</button>
    </div>

    <!-- Fila 2: Filtro de Estados / Oportunidades -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[11px]">
      <button onclick="setStatusFilter('any')" class="status-chip px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition shadow-sm border" data-stat="any">Cualquier estado</button>
      <button onclick="setStatusFilter('open')" class="status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border" data-stat="open">🟢 Abiertas</button>
      <button onclick="setStatusFilter('walkon')" class="status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border" data-stat="walkon">⚡ Sin cola (&lt;15m)</button>
      <button onclick="setStatusFilter('down')" class="status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border" data-stat="down">🛠️ En pausa</button>
      <button onclick="setStatusFilter('refurb')" class="status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border" data-stat="refurb">🚧 Mantenimiento</button>
      <button onclick="setStatusFilter('closed')" class="status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border" data-stat="closed">⛔ Cerradas</button>
      <button onclick="setStatusFilter('single')" class="status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border" data-stat="single">⚡ Single Rider</button>
    </div>

    <!-- Buscador y Ordenación -->
    <div class="flex gap-2">
      <div class="relative flex-1">
        <input type="text" id="searchInput" oninput="actualizarVistas()" placeholder="Buscar por nombre o zona..." class="w-full bg-white border border-slate-300 rounded-xl pl-8 pr-7 py-2 text-xs placeholder-slate-400 text-slate-800 focus:outline-none shadow-sm">
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <button onclick="document.getElementById('searchInput').value=''; actualizarVistas()" class="absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 text-xs">✕</button>
      </div>
      <select id="sortSelect" onchange="renderLista()" class="bg-white border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-semibold focus:outline-none shadow-sm">
        <option value="waitDesc">Más espera</option>
        <option value="waitAsc">Menos espera</option>
        <option value="alpha">A - Z</option>
      </select>
    </div>

    <!-- Indicador de Carga -->
    <div id="loadingStatus" class="text-center py-10 text-xs text-slate-500 font-medium">
      <div id="loadingSpinner" class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-t-transparent mb-2"></div>
      <div>Sincronizando zonas, coordenadas y atracciones...</div>
    </div>

    <!-- CONTENEDOR 1: Vista de Lista y Zonas -->
    <div id="cardsContainer" class="space-y-4"></div>

    <!-- CONTENEDOR 2: Vista de Mapa Interactivo con OpenStreetMap -->
    <div id="mapWrapper" class="hidden relative">
      <div id="map" class="w-full h-[65vh] rounded-2xl border border-slate-300 overflow-hidden shadow-lg z-10"></div>
      
      <!-- Botón flotante para GPS -->
      <button id="gpsBtn" onclick="localizarUsuario()" class="absolute bottom-4 right-4 z-20 text-white p-3 rounded-2xl shadow-xl flex items-center justify-center border-2 transition active:scale-95" title="Centrar en mi ubicación">
        📍 <span class="ml-1 text-xs font-bold">Mi posición</span>
      </button>
    </div>

    <!-- Pie de página con atribución -->
    <footer class="pt-6 pb-2 text-center text-xs text-slate-500 space-y-1">
      <p>
        <a href="https://themeparks.wiki" target="_blank" class="underline hover:text-slate-800 font-medium">
          Powered by ThemeParks.wiki
        </a>
      </p>
    </footer>
  </main>

  <script>
    // DEFINICIÓN DE TEMAS POR PARQUE
    const THEMES = {
      // 1. Disneyland Park Paris (Mickey Fantasía: Blanco, Rojo Escarlata, Azul Marino)
      'dae968d5-630d-4719-8b06-3d107e944401': {
        title: 'UDED - Tiempos Disneyland Park',
        icon: '🪄',
        bodyBg: '#f8fafc',
        primary: '#dc2626',      // Rojo escarlata
        primaryText: '#ffffff',
        secondary: '#172554',    // Azul marino Fantasía
        secondaryText: '#ffffff',
        accentBar: '#dc2626',
        titleColor: '#172554',
        landColor: 'text-blue-950',
        bannerBg: '#dc2626',
        gpsBorder: '#dc2626',
        gpsBg: '#172554',
        spinnerColor: '#dc2626'
      },
      // 2. Disney Adventure World (Frozen: Blanco escarcha, Azul hielo, Fiordo nórdico)
      'ca888437-ebb4-4d50-aed2-d227f7096968': {
        title: 'UDED - Tiempos Disneyland Adventure World',
        icon: '❄️',
        bodyBg: '#f0f9ff',
        primary: '#0284c7',      // Azul cian glaciar
        primaryText: '#ffffff',
        secondary: '#0c4a6e',    // Azul fiordo nórdico
        secondaryText: '#ffffff',
        accentBar: 'linear-gradient(90deg, #38bdf8, #0284c7, #818cf8)',
        titleColor: '#0c4a6e',
        landColor: 'text-sky-900',
        bannerBg: '#0284c7',
        gpsBorder: '#38bdf8',
        gpsBg: '#0c4a6e',
        spinnerColor: '#0284c7'
      },
      // 3. Parque Warner Madrid (Batman / Gotham City Escape: Blanco ceniza, Oro murciélago, Negro)
      '5adbd2f7-3694-4d23-aaec-4037a056573f': {
        title: 'UDED - Tiempos Parque Warner',
        icon: '🦇',
        bodyBg: '#f8fafc',
        primary: '#eab308',      // Amarillo/oro Batman
        primaryText: '#000000',  // Contraste óptimo
        secondary: '#0f172a',    // Negro grafito Batman
        secondaryText: '#ffffff',
        accentBar: 'linear-gradient(90deg, #eab308, #0f172a, #eab308)',
        titleColor: '#0f172a',
        landColor: 'text-amber-900',
        bannerBg: '#0f172a',
        gpsBorder: '#eab308',
        gpsBg: '#0f172a',
        spinnerColor: '#eab308'
      },
      // 4. Parque de Atracciones de Madrid (Arcoíris: Multicolor alegre, Violeta festivo, Índigo)
      '1ea86991-e2c2-4771-8a32-c6e14c8298a9': {
        title: 'UDED - Tiempos Parque de Atracciones de Madrid',
        icon: '🌈',
        bodyBg: '#ffffff',
        primary: '#7c3aed',      // Violeta festivo
        primaryText: '#ffffff',
        secondary: '#1e1b4b',    // Índigo profundo
        secondaryText: '#ffffff',
        accentBar: 'linear-gradient(90deg, #ef4444, #f97316, #eab308, #10b981, #06b6d4, #6366f1, #d946ef)',
        titleColor: '#1e1b4b',
        landColor: 'text-purple-950',
        bannerBg: 'linear-gradient(90deg, #ef4444, #f97316, #10b981, #6366f1)',
        gpsBorder: '#ec4899',
        gpsBg: '#1e1b4b',
        spinnerColor: '#7c3aed'
      }
    };

    function getTemaActual() {
      const parkId = document.getElementById('parkSelect').value;
      return THEMES[parkId] || THEMES['dae968d5-630d-4719-8b06-3d107e944401'];
    }

    function aplicarTema() {
      const theme = getTemaActual();

      document.body.style.backgroundColor = theme.bodyBg;

      document.getElementById('headerIcon').textContent = theme.icon;
      document.getElementById('headerTitle').textContent = theme.title;
      document.getElementById('headerTitle').style.color = theme.titleColor;
      document.getElementById('headerAccentBar').style.background = theme.accentBar;

      const refBtn = document.getElementById('refreshBtn');
      refBtn.style.backgroundColor = theme.primary;
      refBtn.style.color = theme.primaryText;

      document.getElementById('loadingSpinner').style.borderColor = theme.spinnerColor;
      document.getElementById('loadingSpinner').style.borderTopColor = 'transparent';

      document.getElementById('scheduleTextWrapper').style.color = theme.titleColor;

      const gpsBtn = document.getElementById('gpsBtn');
      if (gpsBtn) {
        gpsBtn.style.backgroundColor = theme.gpsBg;
        gpsBtn.style.borderColor = theme.gpsBorder;
      }

      const reBanner = document.getElementById('reopeningBanner');
      if (reBanner) {
        reBanner.style.background = theme.bannerBg;
      }

      actualizarEstilosChips();
    }

    function actualizarEstilosChips() {
      const theme = getTemaActual();

      document.querySelectorAll('.cat-chip').forEach(btn => {
        const isActivo = btn.dataset.cat === catFiltro;
        if (isActivo) {
          btn.style.backgroundColor = theme.primary;
          btn.style.color = theme.primaryText;
          btn.style.borderColor = theme.primary;
          btn.className = 'cat-chip px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition shadow-sm border';
        } else {
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = theme.secondary;
          btn.style.borderColor = '#cbd5e1';
          btn.className = 'cat-chip px-3 py-1.5 rounded-xl font-semibold whitespace-nowrap transition border hover:bg-slate-50';
        }
      });

      document.querySelectorAll('.status-chip').forEach(btn => {
        const isActivo = btn.dataset.stat === statusFiltro;
        if (isActivo) {
          btn.style.backgroundColor = theme.secondary;
          btn.style.color = theme.secondaryText;
          btn.style.borderColor = theme.secondary;
          btn.className = 'status-chip px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition shadow-sm border';
        } else {
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
          btn.style.borderColor = '#cbd5e1';
          btn.className = 'status-chip px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition border hover:bg-slate-50';
        }
      });

      const btnList = document.getElementById('btnViewList');
      const btnZones = document.getElementById('btnViewZones');
      const btnMap = document.getElementById('btnViewMap');

      [btnList, btnZones, btnMap].forEach(btn => {
        btn.style.backgroundColor = 'transparent';
        btn.style.color = '#475569';
      });

      const activeBtn = viewMode === 'list' ? btnList : (viewMode === 'zones' ? btnZones : btnMap);
      activeBtn.style.backgroundColor = theme.secondary;
      activeBtn.style.color = theme.secondaryText;
    }

    let entidades = [];
    let landMap = {};
    let coordsMap = {};
    let catFiltro = 'all';
    let statusFiltro = 'any';
    let viewMode = 'zones';
    let autoRefreshTimer = null;

    const PARK_CENTERS = {
      'dae968d5-630d-4719-8b06-3d107e944401': { lat: 48.8722, lng: 2.7758, zoom: 16 },  // Disneyland Park Paris
      'ca888437-ebb4-4d50-aed2-d227f7096968': { lat: 48.8683, lng: 2.7806, zoom: 16 },  // Disney Adventure World
      '5adbd2f7-3694-4d23-aaec-4037a056573f': { lat: 40.2295, lng: -3.5938, zoom: 16 }, // Parque Warner
      '1ea86991-e2c2-4771-8a32-c6e14c8298a9': { lat: 40.4124, lng: -3.7505, zoom: 16 }  // Parque Atracciones Madrid
    };

    let map = null;
    let markersLayer = null;
    let userMarker = null;

    let prevStatus = {};
    let prevWaitTimes = {};

    function getFavoritos() {
      try { return JSON.parse(localStorage.getItem('tp_favs_v2') || '[]'); } catch { return []; }
    }
    function toggleFavorito(id, event) {
      if (event) event.stopPropagation();
      let favs = getFavoritos();
      favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
      localStorage.setItem('tp_favs_v2', JSON.stringify(favs));
      actualizarVistas();
    }

    function getRiddenToday() {
      const hoy = new Date().toISOString().split('T')[0];
      try { return JSON.parse(localStorage.getItem(`tp_ridden_${hoy}`) || '[]'); } catch { return []; }
    }
    function toggleRidden(id, event) {
      if (event) event.stopPropagation();
      const hoy = new Date().toISOString().split('T')[0];
      let ridden = getRiddenToday();
      ridden = ridden.includes(id) ? ridden.filter(r => r !== id) : [...ridden, id];
      localStorage.setItem(`tp_ridden_${hoy}`, JSON.stringify(ridden));
      actualizarContadorRidden();
      actualizarVistas();
    }
    function actualizarContadorRidden() {
      document.getElementById('countRidden').textContent = getRiddenToday().length;
    }

    // MAPA CON OPENSTREETMAP LIBRE (Sin API Key)
    function initMap() {
      if (map) return;
      const parkId = document.getElementById('parkSelect').value;
      const initial = PARK_CENTERS[parkId] || { lat: 48.8722, lng: 2.7758, zoom: 16 };

      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([initial.lat, initial.lng], initial.zoom);

      // OpenStreetMap público y sin credenciales
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: 'bottomleft' }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function setViewMode(mode) {
      viewMode = mode;
      const cardsContainer = document.getElementById('cardsContainer');
      const mapWrapper = document.getElementById('mapWrapper');

      if (mode === 'list' || mode === 'zones') {
        cardsContainer.classList.remove('hidden');
        mapWrapper.classList.add('hidden');
        renderLista();
      } else if (mode === 'map') {
        cardsContainer.classList.add('hidden');
        mapWrapper.classList.remove('hidden');
        initMap();
        setTimeout(() => {
          map.invalidateSize();
          renderMapa();
        }, 150);
      }
      actualizarEstilosChips();
    }

    function irAlMapa(itemId) {
      const coords = coordsMap[itemId];
      if (!coords) {
        alert('Este elemento no tiene coordenadas registradas en el mapa.');
        return;
      }
      setViewMode('map');
      setTimeout(() => {
        map.flyTo([coords.lat, coords.lng], 18, { animate: true, duration: 1 });
        if (markersLayer) {
          markersLayer.eachLayer(layer => {
            if (layer._itemId === itemId) layer.openPopup();
          });
        }
      }, 200);
    }

    function localizarUsuario() {
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        if (!map) return;

        if (userMarker) map.removeLayer(userMarker);

        const theme = getTemaActual();
        const userIcon = L.divIcon({
          className: 'custom-user-marker',
          html: `<div class="w-4 h-4 rounded-full shadow-lg animate-ping" style="background-color: ${theme.primary}"></div>
                 <div class="w-4 h-4 rounded-full shadow-lg -mt-4 border-2 border-white" style="background-color: ${theme.primary}"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
        map.flyTo([lat, lng], 17, { animate: true });
      }, () => {
        alert('No se pudo obtener tu ubicación. Asegúrate de dar permisos de GPS.');
      });
    }

    function cambiarDeParque() {
      const parkId = document.getElementById('parkSelect').value;
      aplicarTema();
      if (map && PARK_CENTERS[parkId]) {
        const c = PARK_CENTERS[parkId];
        map.setView([c.lat, c.lng], c.zoom);
      }
      cargarTodo();
    }

    function getCategory(item) {
      const name = item.name.toLowerCase();
      const type = item.entityType;

      if (type === 'MERCHANDISE' || type === 'RETAIL' || /tienda|shop|boutique|store|bazar|souvenir|regalos|bazaar/.test(name)) return 'shops';
      if (/meet|encuentro|personaje|rencontre|greeting|photocall|princesa|mickey|donald|goofy|superman y batman|superhéroes|stitch|spider-man/.test(name)) return 'characters';
      if (type === 'SHOW' || (item.showtimes && item.showtimes.length > 0) || /show|espectáculo|parade|cabalgata|desfile|musical|stunt show|teatro|fuegos|fireworks|illumination/.test(name)) return 'shows';
      if (type === 'RESTAURANT' || type === 'DINING' || /restaurante|restaurant|café|cafe|grill|buffet|cantina|diner|burger|helados|ice cream|snack|pizzeria|tavern|taberna|bar/.test(name)) return 'dining';
      return 'attractions';
    }

    function getAttractionIcon(item, category) {
      const n = item.name.toLowerCase();
      if (category === 'shows') return '🎭';
      if (category === 'characters') return '📸';
      if (category === 'dining') return '🍔';
      if (category === 'shops') return '🛍️';

      if (/coaster|montaña|stunt|express|batman|superman|hulk|space|flight|rock|shadows|inver|loop/.test(n)) return '🎢';
      if (/water|rio|river|cataratas|rapidos|splash|flume|cascadas|barca/.test(n)) return '🌊';
      if (/terror|hotel|haunted|fantasma|phantom|mansion|tomb|miedo|horror|inferno/.test(n)) return '👻';
      if (/simulador|flight|3d|4d|cine|blaster|laser|star tours/.test(n)) return '🥽';
      if (/carousel|carrusel|tiovivo|tazas|cups|dumbo|teacups|infantil|kids|sillas/.test(n)) return '🎠';
      if (/torre|caida|drop|tower|vuelo|huracan/.test(n)) return '⚡';
      return '🎡';
    }

    async function cargarTodo() {
      const parkId = document.getElementById('parkSelect').value;
      const loader = document.getElementById('loadingStatus');

      aplicarTema();
      loader.classList.remove('hidden');
      document.getElementById('cardsContainer').innerHTML = '';
      document.getElementById('lastUpdateTxt').textContent = 'Sincronizando...';

      try {
        await Promise.allSettled([
          cargarZonasYCoords(parkId),
          cargarHorarios(parkId),
          cargarLive(parkId)
        ]);
        const ahora = new Date();
        document.getElementById('lastUpdateTxt').textContent = `Actualizado ${ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        actualizarContadorRidden();
      } catch (err) {
        console.error('Error:', err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    async function cargarZonasYCoords(parkId) {
      try {
        const res = await fetch(`https://api.themeparks.wiki/v1/entity/${parkId}/children`);
        if (!res.ok) return;
        const data = await res.json();
        parseHierarchy(data);
      } catch {
        landMap = {};
        coordsMap = {};
      }
    }

    function parseHierarchy(data) {
      landMap = {};
      coordsMap = {};
      const landsById = {};
      const items = Array.isArray(data) ? data : (data.children || []);

      function buscarLands(nodes) {
        if (!nodes) return;
        nodes.forEach(n => {
          if (n.entityType === 'LAND') landsById[n.id] = n.name;
          if (n.location && n.location.latitude && n.location.longitude) {
            coordsMap[n.id] = { lat: n.location.latitude, lng: n.location.longitude };
          }
          if (n.children) buscarLands(n.children);
        });
      }
      buscarLands(items);

      function asignar(nodes, currentLand) {
        if (!nodes) return;
        nodes.forEach(n => {
          let activeLand = currentLand;
          if (n.entityType === 'LAND') activeLand = n.name;
          else if (n.parentId && landsById[n.parentId]) activeLand = landsById[n.parentId];

          if (n.id && activeLand && n.entityType !== 'LAND') {
            landMap[n.id] = activeLand;
          }
          if (n.location && n.location.latitude && n.location.longitude) {
            coordsMap[n.id] = { lat: n.location.latitude, lng: n.location.longitude };
          }
          if (n.children) asignar(n.children, activeLand);
        });
      }
      asignar(items, null);
    }

    async function cargarHorarios(parkId) {
      const scheduleTxt = document.getElementById('scheduleText');
      try {
        const res = await fetch(`https://api.themeparks.wiki/v1/entity/${parkId}/schedule`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const lista = Array.isArray(data) ? data : (data.schedule || []);
        const hoyStr = new Date().toISOString().split('T')[0];
        const hoySchedule = lista.find(item => item.date === hoyStr && item.type === 'OPERATING') || lista[0];

        if (hoySchedule && hoySchedule.openingTime && hoySchedule.closingTime) {
          const open = new Date(hoySchedule.openingTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const close = new Date(hoySchedule.closingTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          scheduleTxt.textContent = `Hoy: ${open} – ${close}`;
        } else {
          scheduleTxt.textContent = 'Horario de hoy no publicado';
        }
      } catch {
        scheduleTxt.textContent = 'Horario no disponible';
      }
    }

    async function cargarLive(parkId) {
      const res = await fetch(`https://api.themeparks.wiki/v1/entity/${parkId}/live`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      entidades = data.liveData || [];

      let abiertas = 0, pausa = 0, cerradas = 0;
      let reabiertas = [];
      const newStatus = {};
      const newWaits = {};

      entidades.forEach(item => {
        const estado = item.status || 'CLOSED';
        const tiempo = item.queue?.STANDBY?.waitTime;

        if (estado === 'OPERATING') abiertas++;
        else if (estado === 'DOWN') pausa++;
        else cerradas++;

        if (item.location && item.location.latitude && item.location.longitude) {
          coordsMap[item.id] = { lat: item.location.latitude, lng: item.location.longitude };
        }

        if (prevStatus[item.id] === 'DOWN' && estado === 'OPERATING') {
          reabiertas.push(item.name);
        }

        newStatus[item.id] = estado;
        if (tiempo != null) newWaits[item.id] = tiempo;
      });

      if (reabiertas.length > 0) {
        const banner = document.getElementById('reopeningBanner');
        document.getElementById('reopeningText').textContent = `¡Acaba de reabrir: ${reabiertas.join(', ')}!`;
        banner.classList.remove('hidden');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }

      document.getElementById('countOpen').textContent = abiertas;
      document.getElementById('countDown').textContent = pausa;
      document.getElementById('countClosed').textContent = cerradas;

      prevStatus = newStatus;
      prevWaitTimes = newWaits;
      actualizarVistas();
    }

    function setCatFilter(cat) {
      catFiltro = cat;
      actualizarEstilosChips();
      actualizarVistas();
    }

    function setStatusFilter(stat) {
      statusFiltro = stat;
      actualizarEstilosChips();
      actualizarVistas();
    }

    function actualizarVistas() {
      if (viewMode === 'map') {
        renderMapa();
      } else {
        renderLista();
      }
    }

    function getElementosFiltrados() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const favs = getFavoritos();

      return entidades.filter(item => {
        const landName = (landMap[item.id] || '').toLowerCase();
        const matchesQuery = item.name.toLowerCase().includes(query) || landName.includes(query);
        if (!matchesQuery) return false;

        const cat = getCategory(item);
        const isFav = favs.includes(item.id);
        const status = item.status || 'CLOSED';
        const wait = item.queue?.STANDBY?.waitTime;

        if (catFiltro === 'favs' && !isFav) return false;
        if (catFiltro !== 'all' && catFiltro !== 'favs' && cat !== catFiltro) return false;

        if (statusFiltro === 'open' && status !== 'OPERATING') return false;
        if (statusFiltro === 'walkon' && (status !== 'OPERATING' || wait == null || wait >= 15)) return false;
        if (statusFiltro === 'down' && status !== 'DOWN') return false;
        if (statusFiltro === 'refurb' && status !== 'REFURBISHMENT') return false;
        if (statusFiltro === 'closed' && status !== 'CLOSED') return false;
        if (statusFiltro === 'single' && item.queue?.SINGLE_RIDER?.waitTime == null) return false;

        return true;
      });
    }

    function renderMapa() {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();

      const items = getElementosFiltrados();
      const favs = getFavoritos();
      const theme = getTemaActual();

      items.forEach(item => {
        const coords = coordsMap[item.id];
        if (!coords || !coords.lat || !coords.lng) return;

        const cat = getCategory(item);
        const icon = getAttractionIcon(item, cat);
        const wait = item.queue?.STANDBY?.waitTime;
        const status = item.status || 'CLOSED';

        let badgeBg = 'bg-white text-slate-700 border-slate-300';
        let badgeText = `${icon}`;

        if (status === 'OPERATING') {
          if (wait != null) {
            badgeText = `${icon} ${wait}m`;
            badgeBg = wait > 45 ? 'bg-red-600 text-white border-red-700' :
                      wait > 20 ? 'bg-amber-500 text-white border-amber-600' :
                      'bg-emerald-600 text-white border-emerald-700';
          } else {
            badgeText = `${icon}`;
            badgeBg = 'bg-emerald-600 text-white border-emerald-700';
          }
        } else if (status === 'DOWN') {
          badgeText = `🛠️ Pausa`;
          badgeBg = 'bg-amber-600 text-white border-amber-700';
        } else {
          badgeText = `${icon}`;
          badgeBg = 'bg-slate-200 text-slate-500 border-slate-300 opacity-80';
        }

        const markerHtml = `
          <div class="px-2 py-1 rounded-full text-[10px] font-extrabold shadow-md border flex items-center gap-1 -translate-x-1/2 -translate-y-1/2 whitespace-nowrap cursor-pointer transition transform hover:scale-125 ${badgeBg}">
            ${badgeText}
          </div>
        `;

        const customIcon = L.divIcon({
          className: 'custom-park-pin',
          html: markerHtml,
          iconSize: [0, 0]
        });

        const marker = L.marker([coords.lat, coords.lng], { icon: customIcon });
        marker._itemId = item.id;

        const land = landMap[item.id];
        const popupContent = `
          <div class="text-xs p-1.5 min-w-[170px] space-y-1.5">
            <div class="font-extrabold flex items-center justify-between gap-2" style="color: ${theme.titleColor}">
              <span>${item.name}</span>
              <button onclick="toggleFavorito('${item.id}', event)" class="text-sm">${favs.includes(item.id) ? '⭐' : '☆'}</button>
            </div>
            ${land ? `<p class="text-[10px] font-bold" style="color: ${theme.primary}">${land}</p>` : ''}
            <div class="flex items-center justify-between pt-1 border-t border-slate-200 text-[11px]">
              <span class="text-slate-500">Estado:</span>
              <span class="font-bold ${status === 'OPERATING' ? 'text-emerald-700' : 'text-slate-500'}">
                ${status === 'OPERATING' ? (wait != null ? `${wait} min` : 'Abierto') : (status === 'DOWN' ? 'En pausa' : 'Cerrado')}
              </span>
            </div>
            ${item.queue?.SINGLE_RIDER?.waitTime != null ? `<div class="text-[10px] font-bold" style="color: ${theme.secondary}">⚡ Single: ${item.queue.SINGLE_RIDER.waitTime}m</div>` : ''}
          </div>
        `;

        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
      });
    }

    function renderLista() {
      const container = document.getElementById('cardsContainer');
      const sortType = document.getElementById('sortSelect').value;
      const favs = getFavoritos();
      const ridden = getRiddenToday();
      const theme = getTemaActual();

      container.innerHTML = '';
      let filtradas = getElementosFiltrados();

      filtradas.sort((a, b) => {
        if (catFiltro === 'all') {
          const favA = favs.includes(a.id) ? 1 : 0;
          const favB = favs.includes(b.id) ? 1 : 0;
          if (favA !== favB) return favB - favA;
        }
        const waitA = a.queue?.STANDBY?.waitTime ?? -1;
        const waitB = b.queue?.STANDBY?.waitTime ?? -1;

        if (sortType === 'waitDesc') return waitB - waitA;
        if (sortType === 'waitAsc') return (waitA === -1 ? 999 : waitA) - (waitB === -1 ? 999 : waitB);
        if (sortType === 'alpha') return a.name.localeCompare(b.name);
        return 0;
      });

      if (filtradas.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-xs text-slate-500 font-medium">No se encontraron elementos con los filtros seleccionados.</div>';
        return;
      }

      if (viewMode === 'zones') {
        const zonas = {};
        filtradas.forEach(item => {
          const zona = landMap[item.id] || 'General / Otras áreas';
          if (!zonas[zona]) zonas[zona] = [];
          zonas[zona].push(item);
        });

        Object.keys(zonas).sort().forEach(zona => {
          const sec = document.createElement('div');
          sec.className = 'space-y-2';

          const header = document.createElement('div');
          header.className = 'flex items-center justify-between pt-2 pb-1 border-b border-slate-300 text-xs font-bold';
          header.style.color = theme.titleColor;
          header.innerHTML = `
            <span class="flex items-center gap-1.5">📍 ${zona}</span>
            <span class="text-[10px] text-slate-500 font-normal">${zonas[zona].length}</span>
          `;
          sec.appendChild(header);

          zonas[zona].forEach(item => {
            sec.appendChild(crearCard(item, favs, ridden));
          });
          container.appendChild(sec);
        });
      } else {
        filtradas.forEach(item => {
          container.appendChild(crearCard(item, favs, ridden));
        });
      }
    }

    function crearCard(item, favs, ridden) {
      const theme = getTemaActual();
      const cat = getCategory(item);
      const icon = getAttractionIcon(item, cat);
      const isFav = favs.includes(item.id);
      const isRidden = ridden.includes(item.id);
      const status = item.status || 'CLOSED';
      const wait = item.queue?.STANDBY?.waitTime;
      const singleWait = item.queue?.SINGLE_RIDER?.waitTime;
      const paidReturn = item.queue?.PAID_RETURN_TIME;
      const land = landMap[item.id];
      const hasCoords = !!coordsMap[item.id];

      let trendHtml = '';
      if (prevWaitTimes[item.id] != null && wait != null) {
        const diff = wait - prevWaitTimes[item.id];
        if (diff > 0) trendHtml = `<span class="text-[10px] text-red-600 font-bold block">↑ +${diff}m</span>`;
        else if (diff < 0) trendHtml = `<span class="text-[10px] text-emerald-600 font-bold block">↓ ${diff}m</span>`;
      }

      let badgeHtml = '';
      if (status === 'OPERATING') {
        if (wait != null) {
          const colorClass = wait > 45 ? 'bg-red-50 text-red-700 border-red-300' :
                             wait > 20 ? 'bg-amber-50 text-amber-800 border-amber-300' :
                             'bg-emerald-50 text-emerald-800 border-emerald-300';
          badgeHtml = `
            <div class="text-right shrink-0">
              <span class="text-base font-extrabold px-2.5 py-1 rounded-xl border ${colorClass} inline-block whitespace-nowrap shadow-sm">${wait} min</span>
              ${trendHtml}
            </div>`;
        } else {
          badgeHtml = `<span class="text-xs px-2.5 py-1 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-300 font-bold whitespace-nowrap shrink-0">Abierto</span>`;
        }
      } else if (status === 'DOWN') {
        badgeHtml = `<span class="text-xs px-2 py-0.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-300 font-bold whitespace-nowrap shrink-0">En pausa</span>`;
      } else if (status === 'REFURBISHMENT') {
        badgeHtml = `<span class="text-xs px-2 py-0.5 rounded-lg bg-blue-50 text-blue-900 border border-blue-300 font-bold whitespace-nowrap shrink-0">Mantenimiento</span>`;
      } else {
        badgeHtml = `<span class="text-xs px-2 py-0.5 rounded-lg bg-slate-100 text-slate-500 border border-slate-300 font-medium whitespace-nowrap shrink-0">Cerrado</span>`;
      }

      const pills = [];
      if (singleWait != null) {
        pills.push(`<span class="inline-flex items-center text-[10px] bg-slate-100 border border-slate-300 px-2 py-0.5 rounded-md font-bold whitespace-nowrap" style="color: ${theme.titleColor}">⚡ Single: <b>${singleWait}m</b></span>`);
      }
      if (paidReturn && paidReturn.returnStart) {
        const horaIni = formatHora(paidReturn.returnStart);
        const horaFin = paidReturn.returnEnd ? formatHora(paidReturn.returnEnd) : '';
        const precio = paidReturn.price?.formatted ? ` • ${paidReturn.price.formatted}` : '';
        pills.push(`<span class="inline-flex items-center text-[10px] bg-slate-100 border border-slate-300 px-2 py-0.5 rounded-md font-bold whitespace-nowrap" style="color: ${theme.titleColor}">🎟️ Pase: ${horaIni}-${horaFin}${precio}</span>`);
      }

      if (item.showtimes && item.showtimes.length > 0) {
        const prox = calcularProximoShow(item.showtimes);
        if (prox) {
          pills.push(`<span class="text-[10px] bg-amber-50 border border-amber-300 text-amber-900 px-2 py-0.5 rounded-md font-bold whitespace-nowrap">🎭 Próximo: ${prox.hora} (${prox.countdown})</span>`);
        } else {
          const listHoras = item.showtimes.slice(0, 3).map(st => formatHora(st.startTime)).join(', ');
          pills.push(`<span class="text-[10px] bg-amber-50 border border-amber-200 text-amber-800 px-2 py-0.5 rounded-md whitespace-nowrap">Pases: ${listHoras}</span>`);
        }
      }

      const extraInfoHtml = pills.length > 0 ? `<div class="flex flex-wrap gap-1 mt-2 pt-2 border-t border-slate-100">${pills.join('')}</div>` : '';

      const labelsCat = {
        attractions: 'Atracción',
        shows: 'Espectáculo',
        characters: 'Personaje',
        dining: 'Restauración',
        shops: 'Tienda'
      };

      const card = document.createElement('div');
      card.className = `bg-white border ${isFav ? 'border-amber-400 bg-amber-50/20' : 'border-slate-200'} p-3.5 rounded-2xl shadow-sm hover:shadow transition ${isRidden ? 'opacity-40' : ''}`;
      
      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-start gap-2.5 min-w-0 flex-1">
            <button onclick="toggleFavorito('${item.id}', event)" class="text-base mt-0.5 active:scale-125 focus:outline-none shrink-0" title="Favorito">
              ${isFav ? '⭐' : '☆'}
            </button>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="text-xs shrink-0">${icon}</span>
                <h3 class="font-bold text-sm leading-snug line-clamp-2 ${isRidden ? 'line-through text-slate-400' : ''}" style="color: ${isRidden ? '#94a3b8' : theme.titleColor}">${item.name}</h3>
              </div>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider whitespace-nowrap">${labelsCat[cat]}</span>
                ${land ? `<span class="text-[10px] font-bold truncate ${theme.landColor}">• ${land}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            ${badgeHtml}
            ${hasCoords ? `
              <button onclick="irAlMapa('${item.id}')" class="text-xs p-1.5 rounded-lg border border-slate-300 bg-slate-50 hover:bg-slate-100 transition shrink-0" style="color: ${theme.titleColor}" title="Ver en el mapa">
                📍
              </button>
            ` : ''}
            ${cat === 'attractions' ? `
              <button onclick="toggleRidden('${item.id}', event)" class="text-xs p-1.5 rounded-lg border ${isRidden ? 'bg-emerald-600 border-emerald-600 text-white font-bold' : 'border-slate-300 text-slate-400 hover:text-slate-800'} shrink-0" title="Marcar como montada">
                ✓
              </button>
            ` : ''}
          </div>
        </div>
        ${extraInfoHtml}
      `;
      return card;
    }

    function formatHora(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        return isNaN(d.getTime()) ? isoStr : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch {
        return isoStr;
      }
    }

    function calcularProximoShow(showtimes) {
      const ahora = new Date().getTime();
      for (const st of showtimes) {
        const t = new Date(st.startTime).getTime();
        const diffMin = Math.round((t - ahora) / 60000);
        if (diffMin > -5 && diffMin <= 180) {
          const countdown = diffMin <= 0 ? '¡Empezando!' : `en ${diffMin} min`;
          return { hora: formatHora(st.startTime), countdown };
        }
      }
      return null;
    }

    function toggleAutoRefresh() {
      const isChecked = document.getElementById('autoRefreshCheck').checked;
      if (isChecked) {
        autoRefreshTimer = setInterval(() => {
          cargarLive(document.getElementById('parkSelect').value);
        }, 60000);
      } else {
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      }
    }

    // Arranque inicial con tema
    aplicarTema();
    cargarTodo();
  </script>
</body>
</html>
